name: "PR Checks (Title, Branch & Commits)"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Naming Convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          PATTERN="^(main|develop|dependabot\/[a-zA-Z0-9._\/-]+|(feat|fix|docs|style|refactor|perf|test|chore|ci|hotfix)\/[a-z0-9-]+)$"
          if ! echo "$BRANCH_NAME" | grep -Eq "$PATTERN"; then
            echo "❌ Invalid branch name: '$BRANCH_NAME'"
            echo "💡 Use format: <type>/<kebab-case-description> (e.g., feat/auth-discord)"
            exit 1
          fi

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Conventional Commits and Blank Line on All PR Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\([a-zA-Z0-9_-]+\))?!?: [a-zA-Z0-9].{0,72}$"
          COMMITS=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          HAS_ERROR=0

          for SHA in $COMMITS; do
            SHORT_SHA=$(git rev-parse --short "$SHA")
            CLEAN_MSG=$(git log -n 1 --format=%B "$SHA" | tr -d '\r')
            COMMIT_TITLE=$(echo "$CLEAN_MSG" | sed -n '1p')
            SECOND_LINE=$(echo "$CLEAN_MSG" | sed -n '2p')

            if ! echo "$COMMIT_TITLE" | grep -Eq "$PATTERN"; then
              echo "❌ [$SHORT_SHA] Invalid commit title: '$COMMIT_TITLE'"
              echo "   Must follow Conventional Commits (max 72 characters)."
              HAS_ERROR=1
            fi

            if [ -n "$SECOND_LINE" ]; then
              echo "❌ [$SHORT_SHA] Missing a blank line after commit title: '$COMMIT_TITLE'"
              HAS_ERROR=1
            fi
          done

          if [ "$HAS_ERROR" -ne 0 ]; then
            echo ""
            echo "💡 Fix your commits using 'git rebase -i' and push with 'git push --force-with-lease'."
            exit 1
          fi

          echo "✅ All PR commits follow the commit message standard."
